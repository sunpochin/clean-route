# 檔案用途：PR 與 main 的 CI——安裝、lint、typecheck、unit test、production build。
# 所在層：.github/workflows。
# 主要關聯：.githooks/pre-commit（本機閘門，指令需一致）、package.json scripts。

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
